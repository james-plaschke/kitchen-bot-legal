<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Text Kitchen Bot</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
    background: #0b0b0f; color: #fff; margin: 0; min-height: 100vh;
    display: flex; align-items: center; justify-content: center; text-align: center;
    padding: 40px 24px; box-sizing: border-box;
  }
  .card { max-width: 420px; }
  h1 { font-size: 1.6em; margin-bottom: .3em; }
  p { color: #9a9aa5; font-size: 1.05em; line-height: 1.5; }
  a.btn {
    display: inline-block; margin-top: 28px; background: #0b93f6; color: #fff;
    text-decoration: none; font-weight: 700; font-size: 1.2em; padding: 18px 36px;
    border-radius: 30px;
  }
  .num { color: #9be15d; font-weight: 700; margin-top: 18px; font-size: 1.1em; }
</style>
</head>
<body>
<div class="card">
  <h1>🍳 Kitchen Bot</h1>
  <p>Tap below — it'll open Messages with everything filled in. Just hit send.</p>
  <a class="btn" id="smslink" href="#">Text Kitchen Bot</a>
  <div class="num">(571) 714-8805</div>
</div>
<script>
  var number = "+15717148805";
  var body = "Hi Kitchen Bot!";
  var isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);
  // iOS Safari wants '&body=', Android/Chrome wants '?body='
  var sep = isIOS ? "&" : "?";
  var link = "sms:" + number + sep + "body=" + encodeURIComponent(body);
  document.getElementById("smslink").href = link;
</script>
</body>
</html>
